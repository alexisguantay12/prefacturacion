{% extends "base.html" %}

{% block content %}

<style>
    .page-wrap {
        max-width: 1000px;
        margin: 0 auto;
    }

    .form-hero {
        background: #ffffff;
        border-radius: 20px;
        padding: 1.4rem 1.6rem;
        margin-bottom: 1.2rem;
        box-shadow: 0 10px 28px rgba(15, 76, 129, 0.14);
        border: 1px solid #d6dce5;
    }

    .form-hero h2 {
        margin: 0;
        font-weight: 900;
        font-size: 1.65rem;
        color: #111827;
    }

    .form-card {
        background: #ffffff;
        border: 1px solid #d6dce5;
        border-radius: 18px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        overflow: hidden;
        margin-bottom: 1rem;
    }

    .section-title {
        background: #fbfdff;
        border-bottom: 1px solid #dbe3ef;
        padding: 0.85rem 1.15rem;
        font-weight: 900;
        color: #1f2937;
    }

    .section-body {
        padding: 1.15rem;
    }

    .form-label {
        font-size: 0.8rem;
        font-weight: 800;
        color: #1f2937;
        margin-bottom: 0.35rem;
    }

    .form-control {
        border-radius: 12px;
        border: 1px solid #cfd8e3;
    }

    .actions-bar {
        background: #ffffff;
        border: 1px solid #d6dce5;
        border-radius: 16px;
        padding: 0.85rem;
        display: flex;
        justify-content: space-between;
    }
</style>

<div class="container-fluid py-3">

    <div class="page-wrap">

        <div class="form-hero">

            <div class="d-flex justify-content-between align-items-start gap-3">

                <div>

                    <h2>
                        <i class="fas fa-plus-circle text-primary"></i>
                        Nuevo procedimiento
                    </h2>

                    <div class="text-muted mt-1">
                        Configure un nuevo procedimiento programado.
                    </div>

                </div>

                <a href="{% url 'gestion_app:lista_procedimientos' %}"
                   class="btn btn-outline-secondary">

                    <i class="fas fa-arrow-left"></i>
                    Volver

                </a>

            </div>

        </div>

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="post">

            {% csrf_token %}

            <div class="form-card">

                <div class="section-title">

                    <i class="fas fa-clipboard-list text-primary"></i>
                    Datos del procedimiento

                </div>

                <div class="section-body">

                    <div class="row g-3">

                        <div class="col-md-8">

                            <label class="form-label">
                                Nombre *
                            </label>

                            <input type="text"
                                   name="nombre"
                                   class="form-control"
                                   required
                                   value="{{ nombre|default:'' }}"
                                   placeholder="Ej: Cesárea">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label d-block">
                                Estado
                            </label>

                            <div class="form-check mt-2">

                                <input type="checkbox"
                                       name="activo"
                                       class="form-check-input"
                                       id="activo"
                                       {% if activo or activo is None %}checked{% endif %}>

                                <label class="form-check-label"
                                       for="activo">

                                    Procedimiento activo

                                </label>

                            </div>

                        </div>

                        <div class="col-md-12">

                            <label class="form-label">
                                Descripción
                            </label>

                            <textarea name="descripcion"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Descripción opcional del procedimiento...">{{ descripcion|default:'' }}</textarea>

                        </div>

                    </div>

                </div>

            </div>

            <div class="actions-bar">

                <a href="{% url 'gestion_app:lista_procedimientos' %}"
                   class="btn btn-outline-secondary">

                    Cancelar

                </a>

                <button type="submit"
                        class="btn btn-primary px-4">

                    <i class="fas fa-save"></i>
                    Guardar procedimiento

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
