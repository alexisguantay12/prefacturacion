{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">

    <div class="card shadow-sm border-0 rounded-4 mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-1 fw-bold">Agregar orden</h5>
                <small class="text-muted">
                    Preingreso #{{ preingreso.id }} - {{ preingreso.paciente.apellido }}, {{ preingreso.paciente.nombre }}
                </small>
            </div>

            <a href="{% url 'listar_ordenes_preingreso' preingreso.id %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="card shadow-sm border-0 rounded-4 mb-3">
            <div class="card-header bg-white border-0 fw-semibold">
                Datos de la orden
            </div>

            <div class="card-body">
                <div class="row g-3">

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Tipo de orden</label>
                        <input type="text" name="tipo" class="form-control form-control-sm" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">N° de orden</label>
                        <input type="text" name="nro_orden" class="form-control form-control-sm" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Fecha</label>
                        <input type="date" name="fecha" class="form-control form-control-sm">
                    </div>

                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-3">
            <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
                <span class="fw-semibold">Detalle de prestaciones</span>

                <button type="button" class="btn btn-success btn-sm" onclick="agregarFilaDetalle()">
                    <i class="bi bi-plus-circle"></i> Agregar prestación
                </button>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0 small" id="tablaDetalles">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 140px;" class="ps-3">Código</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th style="width: 80px;" class="text-end pe-3">Quitar</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td class="ps-3">
                                    <input type="hidden" name="prestacion_id[]" value="">
                                    <input type="text" name="codigo[]" class="form-control form-control-sm">
                                </td>
                                <td>
                                    <input type="text" name="nombre[]" class="form-control form-control-sm">
                                </td>
                                <td>
                                    <input type="text" name="descripcion[]" class="form-control form-control-sm">
                                </td>
                                <td class="text-end pe-3">
                                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="quitarFila(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'listar_ordenes_preingreso' preingreso.id %}" class="btn btn-outline-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn btn-primary">
                Guardar orden
            </button>
        </div>

    </form>

</div>

<script>
function agregarFilaDetalle() {
    const tbody = document.querySelector("#tablaDetalles tbody");

    const fila = document.createElement("tr");
    fila.innerHTML = `
        <td class="ps-3">
            <input type="hidden" name="prestacion_id[]" value="">
            <input type="text" name="codigo[]" class="form-control form-control-sm">
        </td>
        <td>
            <input type="text" name="nombre[]" class="form-control form-control-sm">
        </td>
        <td>
            <input type="text" name="descripcion[]" class="form-control form-control-sm">
        </td>
        <td class="text-end pe-3">
            <button type="button" class="btn btn-outline-danger btn-sm" onclick="quitarFila(this)">
                <i class="bi bi-trash"></i>
            </button>
        </td>
    `;

    tbody.appendChild(fila);
}

function quitarFila(btn) {
    const tbody = document.querySelector("#tablaDetalles tbody");

    if (tbody.children.length === 1) {
        tbody.querySelectorAll("input").forEach(input => input.value = "");
        return;
    }

    btn.closest("tr").remove();
}
</script>
{% endblock %}
