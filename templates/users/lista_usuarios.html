{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="card shadow rounded-4">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-4">
      <h5 class="mb-0">Gestión de Usuarios</h5>
      <a href="{% url 'users_app:crear_usuario' %}" class="btn btn-light btn-sm">
        <i class="fas fa-user-plus me-1"></i> Nuevo Usuario
      </a>
    </div>
    <div class="card-body p-4">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark text-center">
            <tr>
              <th>Usuario</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {% for usuario in usuarios %}
              <tr class="text-center">
                <td>{{ usuario.username }}</td>
                <td>{{ usuario.email }}</td>
                <td>{{ usuario.groups.first.name|default:"Sin rol" }}</td>
                <td>
                  <a
                    href="{% url 'users_app:blanquear_contraseña' usuario.id %}"
                    class="btn btn-sm btn-outline-warning"
                    title="Blanquear contraseña"
                >
                    <i class="fas fa-key"></i>
                </a>
                </td>
              </tr>
            {% empty %}
              <tr>
                <td colspan="4" class="text-center text-muted">No hay usuarios registrados.</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
